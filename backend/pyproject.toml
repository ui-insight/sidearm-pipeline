[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
description = "Vandals Stats Pipeline — FastAPI backend"
requires-python = ">=3.11"
# Packaging metadata and minimum supported runtime dependency versions.
# Keep these names aligned with backend/requirements.txt, which pins the
# concrete versions used for local installs, CI, containers, and audits.
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "bcrypt>=4.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.31.0",
    "python-multipart>=0.0.32",
    "alembic>=1.19.1",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "anthropic>=0.122.0",
]

[project.optional-dependencies]
# Minimum supported development dependency versions.
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
