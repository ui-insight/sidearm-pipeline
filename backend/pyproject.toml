[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
description = "Vandals Stats Pipeline — FastAPI backend"
requires-python = ">=3.11"
# Packaging metadata and minimum supported runtime dependency versions.
# Keep these names aligned with backend/requirements.txt, which pins the
# concrete versions used for local installs, CI, containers, and audits.
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pyjwt[crypto]>=2.12.1",
    "bcrypt>=4.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.31.0",
    "python-multipart>=0.0.26",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.0",
    "anthropic>=0.97.0",
]

[project.optional-dependencies]
# Minimum supported development dependency versions.
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.27.0",
    "ruff>=0.15.11",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
