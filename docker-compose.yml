services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-app}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - PROTOTYPE_AUTH_ENABLED=${PROTOTYPE_AUTH_ENABLED:-false}
      - PROTOTYPE_AUTH_USERNAME=${PROTOTYPE_AUTH_USERNAME:-prototype}
      - PROTOTYPE_AUTH_PASSWORD=${PROTOTYPE_AUTH_PASSWORD:-}
      - DEV_MODE=${DEV_MODE:-true}
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5173","http://localhost:9200"]}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - CONTENT_MODEL=${CONTENT_MODEL:-claude-opus-4-7}
      - ARTICLE_MODEL=${ARTICLE_MODEL:-}
      - ARTICLE_GENERATION_MAX_TOKENS=${ARTICLE_GENERATION_MAX_TOKENS:-4000}
      - ARTICLE_GENERATION_POLL_SECONDS=${ARTICLE_GENERATION_POLL_SECONDS:-2}
      - ARTICLE_GENERATION_LEASE_SECONDS=${ARTICLE_GENERATION_LEASE_SECONDS:-300}
      - ACHIEVEMENT_MODEL=${ACHIEVEMENT_MODEL:-claude-opus-4-7}
      - ACHIEVEMENT_AI_MAX_CANDIDATES=${ACHIEVEMENT_AI_MAX_CANDIDATES:-100}
      - NLQ_MODEL=${NLQ_MODEL:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "9200:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  uploads:
  postgres-data:
