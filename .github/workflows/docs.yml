name: Deploy Docs and Presentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "presentation/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install mkdocs-material

      # Build the MkDocs site into _publish/docs/ so the deck can occupy the root.
      - name: Build MkDocs into _publish/docs
        run: mkdocs build --strict --site-dir _publish/docs

      # Copy the reveal.js deck to the root of _publish so landing on the site
      # opens the presentation. The MkDocs site is then one click away at /docs/.
      - name: Stage presentation at root
        run: |
          cp -R presentation/. _publish/
          # Drop a tiny redirect note so anyone hitting old /index.html links
          # still finds the docs site by following the link from the deck.

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_publish
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}: deck at /, docs at /docs/"
